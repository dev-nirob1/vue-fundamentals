<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>

  <body>
    <div id="app">
      <h1>{{message}}</h1>
      <!-- use {{}} for dynamic value  -->
       <p>LuckyNumber {{luckyNumber}}</p>
      <p>LuckyNumber: {{updateRandomNumber()}}</p>
      <p>NumbersArray: {{numbers}}</p>
      <p>Employee Data: {{employee.age}}</p>
      <p>Random Number: {{getRandomNumber}}</p>
    </div>
  </body>

  <script>
    const { createApp, ref } = Vue;
    createApp({
      setup() {
        const message = ref("hello world");
        let luckyNumber = ref(5);

        const numbers = [2, 5, 56, 43, 3];
        const employee = ref({
            name: 'Nirob',
            age: '23',
            profession: 'Web dev'
        })

        const updateRandomNumber = ()=> {
           setTimeout(() => {
            luckyNumber.value = 6;
            employee.value.age = 30
           }, 1000);
        }

        // const getEmployeeAge = ()=
        // const getRandomLuckyNumber = ()=> {
        //     luckyNumber = Math.floor(Math.random()*10)+ 1;
        //     console.log('lucky Number', luckyNumber);
        //     return Math.floor(Math.random()*10 + 1)
        // }


        return {
            message,
            // getRandomLuckyNumber,
            luckyNumber,
            numbers,
            employee,
            updateRandomNumber
        };
      },
    }).mount("#app");
  </script>
</html>
